services: 
  postgres: 
    image: postgres:16-alpine 
    container_name: mindshore_postgres 
    restart: unless-stopped 
    environment: 
      POSTGRES_USER: mindshore 
      POSTGRES_PASSWORD: mindshore 
      POSTGRES_DB: mindshore_challenge 
    ports: 
      - "5432:5432" 
    volumes: 
      - postgres_data:/var/lib/postgresql/data 
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U mindshore"] 
      interval: 5s 
      timeout: 5s 
      retries: 5 
volumes: 
  postgres_data: