server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
    index index.html;

    # Esto es clave para apps de React Router: si alguien entra directo a
    # una URL como /collections/abc123 (sin pasar primero por "/"), nginx
    # por defecto buscaría un archivo llamado "collections/abc123" y no lo
    # encontraría (404). Esta línea le dice "si no existe ese archivo,
    # serví igual index.html", y React Router se encarga de mostrar la
    # página correcta del lado del cliente.
    try_files $uri /index.html;
  }
}
